<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | VisaSlot</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Shared Logo Styles */
        .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .logo-pulse { width: 10px; height: 10px; background: var(--blue, #3b6ef8); border-radius: 50%; position: relative; flex-shrink: 0; }
        .logo-pulse::after { content: absolute; inset: -4px; border-radius: 50%; background: var(--blue, #3b6ef8); opacity: 0.3; animation: pulse-ring 1.8s ease-out infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.4; } 100% { transform: scale(2); opacity: 0; } }
        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-visa { color: var(--navy, #0f1a3e); }
        .logo-slot { color: var(--blue, #3b6ef8); }

        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color, #e5e7eb);
        }
        .admin-row:last-child {
            border-bottom: none;
        }
        .admin-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .admin-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        .admin-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .btn-danger {
            background-color: #fee2e2;
            color: #ef4444;
            border: 1px solid #f87171;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .btn-danger:hover {
            background-color: #fecaca;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/'">
                <div class="logo-pulse"></div>
                <div class="logo-text"><span class="logo-visa">Visa</span><span class="logo-slot">Slot</span></div>
            </div>
            <nav class="nav-links">
                <div class="nav-item" onclick="window.location.href='/'">Live Feed</div>
                <div class="nav-item" onclick="window.location.href='/timelines'">Timelines</div>
                <div class="nav-item active" onclick="window.location.href='/admin'">Admin</div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Login Section -->
        <section id="loginSection" class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2 style="margin-bottom: 1rem; text-align: center;">Admin Access</h2>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <button class="btn btn-primary" onclick="attemptLogin()" style="width: 100%; margin-top: 1rem;">
                Unlock Panel
            </button>
            <p id="loginError" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none;">
                Incorrect password.
            </p>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboardSection" style="display: none; margin-top: 2rem;">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>Moderation Panel</h2>
                    <button class="btn btn-secondary" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Logout</button>
                </div>
                
                <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem;">
                    Manage user-submitted slot reports below.
                </p>

                <div id="adminFeed">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading reports...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer style="text-align: center; padding: 2rem; margin-top: 2rem; border-top: 1px solid rgba(0,0,0,0.07); color: #6b7280; font-size: 0.9rem;">
        &copy; 2026 VisaSlot. Community-powered intelligence.
    </footer>

    <script src="js/supabase.js"></script>
    <script>
        const ADMIN_PASSWORD = "visaslotadmin"; 

        function attemptLogin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('adminPassword').value = ''; 
                loadReports();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminFeed').innerHTML = ''; 
        }

        document.getElementById('adminPassword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                attemptLogin();
            }
        });

        async function loadReports() {
            const feedContainer = document.getElementById('adminFeed');
            feedContainer.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading reports...</p></div>';

            try {
                const { data, error } = await supabaseClient
                    .from('slot_reports')
                    .select('*')
                    .order('reported_at', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    feedContainer.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 1rem;">No reports found in the database.</p>';
                    return;
                }

                let html = '';
                data.forEach(report => {
                    const statusText = report.slot_found ? '🟢 Slot Found' : '🔴 Checked - No Slot';
                    const reportDate = new Date(report.reported_at).toLocaleString();

                    html += `
                        <div class="admin-row" id="row-${report.id}">
                            <div class="admin-details">
                                <div class="admin-title">${report.embassy}, ${report.country}</div>
                                <div class="admin-meta">
                                    ${report.visa_category} &bull; ${statusText} &bull; ID: ${report.id}
                                </div>
                                <div class="admin-meta" style="font-size: 0.75rem;">
                                    Reported: ${reportDate} ${report.reporter_email ? `&bull; By: ${report.reporter_email}` : ''}
                                </div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteReport(${report.id})">Delete</button>
                        </div>
                    `;
                });

                feedContainer.innerHTML = html;

            } catch (error) {
                console.error("Error loading reports:", error);
                feedContainer.innerHTML = '<p style="color: #ef4444; text-align: center;">Error loading data. Check console.</p>';
            }
        }

        async function deleteReport(id) {
            if (!confirm("Are you sure you want to permanently delete this report?")) {
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('slot_reports')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                const row = document.getElementById(`row-${id}`);
                if (row) {
                    row.remove();
                }

            } catch (error) {
                console.error("Error deleting report:", error);
                alert("Failed to delete the report. Make sure your Supabase RLS policies allow deletes.");
            }
        }
    </script>
</body>
</html>
