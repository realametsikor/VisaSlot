<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisaSlot | Live Appointment Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/'" style="cursor: pointer;">VisaSlot</div>
            <nav class="nav-links">
                <div class="nav-item active" onclick="window.location.href='/'">Live Feed</div>
                <div class="nav-item" onclick="window.location.href='/timelines'">Timelines</div>
                <div class="nav-item" onclick="window.location.href='/admin'">Admin</div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>Find Your Visa Appointment Faster</h1>
            <div id="statsCounter" class="hero-stats">Loading live stats...</div>
            <p>Join the community tracking real-time embassy slot availability worldwide.</p>
            <div class="hero-actions">
                <button class="btn btn-primary" onclick="window.location.href='/report'">Report a Slot</button>
                <button class="btn btn-secondary" onclick="window.location.href='/alerts'">Get Alerts</button>
            </div>
        </section>

        <!-- Tab Switcher -->
        <div class="tabs">
            <button class="tab active" onclick="window.location.href='/'">Slots</button>
            <button class="tab" onclick="window.location.href='/timelines'">Timelines</button>
        </div>

        <!-- Filter Bar -->
        <section class="filters card">
            <div class="filter-group">
                <label for="countryFilter">Country</label>
                <select id="countryFilter">
                    <option value="all">All Countries</option>
                    <option value="US">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="DE">Germany</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="visaFilter">Visa Category</label>
                <select id="visaFilter">
                    <option value="all">All Categories</option>
                    <option value="F1">F1 Student</option>
                    <option value="B1/B2">B1/B2 Tourist</option>
                    <option value="H1B">H1B Work</option>
                    <option value="Schengen">Schengen</option>
                </select>
            </div>
        </section>

        <!-- Status Board -->
        <section class="status-board card">
            <h3>Embassy Watch — Recently Checked</h3>
            <div id="statusBoardContainer" class="status-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="font-size: 0.85rem;">Fetching latest embassy status...</p>
                </div>
            </div>
        </section>

        <!-- Live Feed Section -->
        <section class="feed-section">
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Loading live slots...</p>
            </div>
            <div id="feedContainer" class="feed-container"></div>
        </section>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
