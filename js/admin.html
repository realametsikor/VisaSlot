<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | VisaSlot</title>
    <!-- Link to our shared stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-row:last-child {
            border-bottom: none;
        }
        .admin-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .admin-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        .admin-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .btn-danger {
            background-color: #fee2e2;
            color: #ef4444;
            border: 1px solid #f87171;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .btn-danger:hover {
            background-color: #fecaca;
        }
    </style>
</head>
<body>
    <!-- Shared Header/Nav -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">VisaSlot</div>
            <nav class="nav-links">
                <div class="nav-item" onclick="window.location.href='index.html'">Live Feed</div>
                <div class="nav-item" onclick="window.location.href='timelines.html'">Timelines</div>
                <div class="nav-item active" onclick="window.location.href='admin.html'">Admin</div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Login Section -->
        <section id="loginSection" class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2 style="margin-bottom: 1rem; text-align: center;">Admin Access</h2>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <button class="btn btn-primary" onclick="attemptLogin()" style="width: 100%; margin-top: 1rem;">
                Unlock Panel
            </button>
            <p id="loginError" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none;">
                Incorrect password.
            </p>
        </section>

        <!-- Dashboard Section (Hidden by default) -->
        <section id="dashboardSection" style="display: none;">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>Moderation Panel</h2>
                    <button class="btn btn-secondary" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Logout</button>
                </div>
                
                <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem;">
                    Manage user-submitted slot reports below.
                </p>

                <div id="adminFeed">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading reports...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Supabase Logic Script -->
    <script src="js/supabase.js"></script>
    <script>
        // --- Admin Configuration ---
        // For prototype purposes only. 
        const ADMIN_PASSWORD = "visaslotadmin"; 

        // --- Authentication Logic ---
        function attemptLogin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                // Success
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('adminPassword').value = ''; // clear field
                loadReports();
            } else {
                // Fail
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminFeed').innerHTML = ''; // clear data
        }

        // Allow pressing 'Enter' to submit the password
        document.getElementById('adminPassword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                attemptLogin();
            }
        });

        // --- Data Fetching & Rendering ---
        async function loadReports() {
            const feedContainer = document.getElementById('adminFeed');
            feedContainer.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading reports...</p></div>';

            try {
                const { data, error } = await supabaseClient
                    .from('slot_reports')
                    .select('*')
                    .order('reported_at', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    feedContainer.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 1rem;">No reports found in the database.</p>';
                    return;
                }

                let html = '';
                data.forEach(report => {
                    const statusText = report.slot_found ? '🟢 Slot Found' : '🔴 Checked - No Slot';
                    const reportDate = new Date(report.reported_at).toLocaleString();

                    html += `
                        <div class="admin-row" id="row-${report.id}">
                            <div class="admin-details">
                                <div class="admin-title">${report.embassy}, ${report.country}</div>
                                <div class="admin-meta">
                                    ${report.visa_category} &bull; ${statusText} &bull; ID: ${report.id}
                                </div>
                                <div class="admin-meta" style="font-size: 0.75rem;">
                                    Reported: ${reportDate} ${report.reporter_email ? `&bull; By: ${report.reporter_email}` : ''}
                                </div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteReport(${report.id})">Delete</button>
                        </div>
                    `;
                });

                feedContainer.innerHTML = html;

            } catch (error) {
                console.error("Error loading reports:", error);
                feedContainer.innerHTML = '<p style="color: #ef4444; text-align: center;">Error loading data. Check console.</p>';
            }
        }

        // --- Data Deletion ---
        async function deleteReport(id) {
            if (!confirm("Are you sure you want to permanently delete this report?")) {
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('slot_reports')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                // Remove the row from the UI immediately
                const row = document.getElementById(`row-${id}`);
                if (row) {
                    row.remove();
                }

            } catch (error) {
                console.error("Error deleting report:", error);
                alert("Failed to delete the report. Make sure your Supabase RLS policies allow deletes.");
            }
        }
    </script>
</body>
</html>
