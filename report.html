<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Slot | VisaSlot</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Shared Logo Styles */
        .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .logo-pulse { width: 10px; height: 10px; background: var(--blue, #3b6ef8); border-radius: 50%; position: relative; flex-shrink: 0; }
        .logo-pulse::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: var(--blue, #3b6ef8); opacity: 0.3; animation: pulse-ring 1.8s ease-out infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.4; } 100% { transform: scale(2); opacity: 0; } }
        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-visa { color: var(--navy, #0f1a3e); }
        .logo-slot { color: var(--blue, #3b6ef8); }

        .toggle-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            background: var(--secondary-color);
            padding: 1rem;
            border-radius: var(--radius-md);
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .radio-label input {
            width: auto;
            accent-color: var(--primary-color);
        }
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/'">
                <div class="logo-pulse"></div>
                <div class="logo-text"><span class="logo-visa">Visa</span><span class="logo-slot">Slot</span></div>
            </div>
            <nav class="nav-links">
                <div class="nav-item" onclick="window.location.href='/'">Live Feed</div>
                <div class="nav-item" onclick="window.location.href='/timelines'">Timelines</div>
                <div class="nav-item" onclick="window.location.href='/admin'">Admin</div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card" style="margin-top: 2rem;">
            <h2 style="margin-bottom: 1.5rem;">Report Slot Status</h2>
            
            <div class="form-container">
                <div class="toggle-container">
                    <label class="radio-label">
                        <input type="radio" name="slotStatus" value="found" checked onchange="toggleDate(true)">
                        I found a slot
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="slotStatus" value="empty" onchange="toggleDate(false)">
                        I checked — nothing available
                    </label>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country">
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="DE">Germany</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="embassy">Embassy City</label>
                    <input type="text" id="embassy" placeholder="e.g., London, Mumbai, Berlin">
                </div>

                <div class="form-group">
                    <label for="visaCategory">Visa Category</label>
                    <select id="visaCategory">
                        <option value="F1">F1 Student</option>
                        <option value="B1/B2">B1/B2 Tourist</option>
                        <option value="H1B">H1B Work</option>
                        <option value="Schengen">Schengen</option>
                    </select>
                </div>

                <div class="form-group" id="datePickerGroup">
                    <label for="slotDate">Slot Date Seen</label>
                    <input type="date" id="slotDate">
                </div>

                <div class="form-group">
                    <label for="reporterEmail">Your Email (Optional)</label>
                    <input type="email" id="reporterEmail" placeholder="To contact you for verification if needed">
                </div>

                <button class="btn btn-primary" onclick="submitReport()" style="margin-top: 1rem; width: 100%;">
                    Submit Report
                </button>
                
                <div id="successMessage" style="display: none; margin-top: 1rem; padding: 1rem; background: var(--success-bg); color: var(--success-color); border-radius: var(--radius-md); text-align: center; font-weight: 500;">
                    Thank you! Your report has been submitted.
                </div>
            </div>
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; margin-top: 2rem; border-top: 1px solid rgba(0,0,0,0.07); color: #6b7280; font-size: 0.9rem;">
        &copy; 2026 VisaSlot. Community-powered intelligence.
    </footer>

    <script>
        function toggleDate(isFound) {
            const dateGroup = document.getElementById('datePickerGroup');
            if (isFound) {
                dateGroup.style.display = 'flex';
            } else {
                dateGroup.style.display = 'none';
                document.getElementById('slotDate').value = ''; 
            }
        }
    </script>
    <script src="js/supabase.js"></script>
    <script src="js/report.js"></script>
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
