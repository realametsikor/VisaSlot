<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Timelines | VisaSlot</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Shared Logo Styles */
        .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .logo-pulse { width: 10px; height: 10px; background: var(--blue, #3b6ef8); border-radius: 50%; position: relative; flex-shrink: 0; }
        .logo-pulse::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: var(--blue, #3b6ef8); opacity: 0.3; animation: pulse-ring 1.8s ease-out infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.4; } 100% { transform: scale(2); opacity: 0; } }
        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-visa { color: var(--navy, #0f1a3e); }
        .logo-slot { color: var(--blue, #3b6ef8); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/'">
                <div class="logo-pulse"></div>
                <div class="logo-text"><span class="logo-visa">Visa</span><span class="logo-slot">Slot</span></div>
            </div>
            <nav class="nav-links">
                <div class="nav-item" onclick="window.location.href='/'">Live Feed</div>
                <div class="nav-item active" onclick="window.location.href='/timelines'">Timelines</div>
                <div class="nav-item" onclick="window.location.href='/admin'">Admin</div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Tab Switcher -->
        <div class="tabs" style="margin-top: 1rem;">
            <button class="tab" onclick="window.location.href='/'">Slots</button>
            <button class="tab active" onclick="window.location.href='/timelines'">Timelines</button>
        </div>

        <section class="card" style="margin-bottom: 2rem;">
            <h2 style="margin-bottom: 0.5rem; font-size: 1.25rem;">Average Processing Times</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
                Community-reported days from submission to decision.
            </p>
            <div style="position: relative; height: 350px; width: 100%;">
                <canvas id="timelineChart"></canvas>
            </div>
        </section>

        <section class="card">
            <h3 style="margin-bottom: 1.5rem; font-size: 1.15rem;">Share Your Timeline</h3>
            <div class="form-container">
                <div class="form-group">
                    <label for="timelineEmbassy">Embassy City</label>
                    <input type="text" id="timelineEmbassy" placeholder="e.g., London, Mumbai, Berlin">
                </div>

                <div class="form-group">
                    <label for="timelineVisaCategory">Visa Category</label>
                    <select id="timelineVisaCategory">
                        <option value="F1">F1 Student</option>
                        <option value="B1/B2">B1/B2 Tourist</option>
                        <option value="H1B">H1B Work</option>
                        <option value="Schengen">Schengen</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 140px;">
                        <label for="dateSubmitted">Date Submitted</label>
                        <input type="date" id="dateSubmitted">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 140px;">
                        <label for="dateDecision">Date of Decision</label>
                        <input type="date" id="dateDecision">
                    </div>
                </div>

                <div class="form-group">
                    <label for="visaOutcome">Outcome</label>
                    <select id="visaOutcome">
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="submitTimeline()" style="margin-top: 1rem; width: 100%;">
                    Submit Timeline
                </button>
                
                <div id="timelineSuccessMessage" style="display: none; margin-top: 1rem; padding: 1rem; background: var(--success-bg); color: var(--success-color); border-radius: var(--radius-md); text-align: center; font-weight: 500;">
                    Thank you! Your timeline helps the community plan ahead.
                </div>
            </div>
        </section>
    </main>

    <footer style="text-align: center; padding: 2rem; margin-top: 2rem; border-top: 1px solid rgba(0,0,0,0.07); color: #6b7280; font-size: 0.9rem;">
        &copy; 2026 VisaSlot. Community-powered intelligence.
    </footer>

    <script src="js/supabase.js"></script>
    <script src="js/timelines.js"></script>
</body>
</html>
